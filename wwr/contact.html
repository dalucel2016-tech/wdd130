<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="David Ucles">
    <meta name="description"
      content="Contact Wild Rafting to ask questions, make reservations, or learn more about our rafting adventures.">
    <title>Contact Page| Wild Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>


<body>
    <header>
        <img src="images/z-raftingbw.png" alt="Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>

        <section>

            <section class="contact-info">
                <h1>whitewater Rafting Company</h1>
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </section>
            <section class="contact-content">
                <div class="map">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1975934.6773392335!2d-88.75050631249911!3d14.69859556542805!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f69a95f941137ed%3A0x4580b39299a604c1!2sR%C3%ADo%20Cangrejal!5e0!3m2!1ses-419!2shn!4v1785973826573!5m2!1ses-419!2shn" width="600" height="450", allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
                </div>
                </section>
            <form action="">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <fieldset>
                    
                    <legend>Message Purpose</legend>
                    
                    <label>
                        <input type="radio" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    
                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="website">
                        Website Suggestion
                    </label>

                    </fieldset>
                <div>
                    
                    <label for="Message">Message</label>
                    
                    <textarea name="Message" id="Message" rows="6"></textarea>
                
                </div>
                
                <div>

                    <label>
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                </div>


                    <Button type="submit">Get in Touch</Button>

            </form>

        </section>
        
    </main>
    <footer>
        <p>&copy; 2026 &#10070; Wild Rafting &#10070; David Ucles &#10070;</p>


        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook-bw.svg" alt="Facebook logo"></a>
            <a href="https://www.instagram.com"><img src="images/instagram-bw.svg"
                  alt="instagram logo"></a>
            <a href="https://www.linkedin.com"><img src="images/linkedin-bw.svg"
                  alt="Linkedin logo"></a>
        </nav>
    </footer>
</body>

</html>
