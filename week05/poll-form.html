<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header></header>
    <main>
        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="usermail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>
        
            
        <label for="quantity">Select</label>
            <select name="quantity" id="quantity">
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
            
        <label for="browser">What is your favorite Internet Browser</label>
            <select name="browser" id="browser">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="other">Other</option>
            </select>
            
            <label for="pet">Do yo have a household pet</label>
                <input type="checkbox" id="pet" name="pet">
            
            <label for="feedback">List the places you have lived</label>
                <textarea id="feedback" name="feedback" rows="4" placeholder="Quetzaltenango,Huhuetenango,Solola,Tegucigalpa"></textarea>
            <button type="submit">Submit Poll</button>
            </form>
    </main>
    <footer></footer>
</body>
</html>
